name: Feed check

# Fetches the real feeds and reports which ones load. Informational: it never blocks a merge.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/pipeline/**'
      - 'scripts/fetch-news.ts'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run fetch:news | tee fetch.log
      - name: Summary
        if: always()
        run: |
          {
            echo '### Feed check'
            echo '```'
            cat fetch.log 2>/dev/null || echo 'fetch did not run'
            echo '```'
            if [ -f public/data/v1/news.json ]; then
              echo
              echo 'Stories per source:'
              echo '```'
              node -e "const f=require('./public/data/v1/news.json');const c={};for(const s of f.stories)c[s.source+' ('+s.topic+')']=(c[s.source+' ('+s.topic+')']||0)+1;for(const [k,v] of Object.entries(c).sort((a,b)=>b[1]-a[1]))console.log(String(v).padStart(4),k)"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: news-json
          path: public/data/v1/news.json
          if-no-files-found: ignore
